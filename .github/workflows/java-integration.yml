name: Java Integration

on:
  workflow_dispatch:

jobs:
  java-integration:
    name: Java Integration (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install causaliq-core
        shell: bash
        run: pip install -e ".[dev]"

      - name: Run Java integration tests
        run: python -m pytest -m java_integration -v --no-cov
